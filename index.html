<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HD2 Loadouts">
<meta name="theme-color" content="#0F1419">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>HD2 Loadouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Super Destroyer terminal. Dark command bar on top, bottom tab bar (Loadouts · Missions · Roll · Armory · Intel).
   Faction colour is the signal hue of every view it owns; Super Earth yellow marks actions and new gear. */
:root{
  --bg:#E7EAEE; --surface:#FFFFFF; --raised:#F3F5F7; --ink:#11161B; --muted:#56616C; --line:#D0D7DE;
  --se:#FFD21F; --se-ink:#7A5C00; --on-se:#11161B;
  --bot:#C93A2F; --bug:#B86400; --squid:#6E46D6; --mission:#2F6F8F;
  --bot-soft:#F8E1DE; --bug-soft:#F9E8D2; --squid-soft:#E9E2FA; --mission-soft:#DCEBF2;
  --good:#1F7A4D; --good-soft:#DDF2E7; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B42318; --bad-soft:#FBE0DD;
  --bar-bg:#0F1419; --bar-ink:#EEF1F4; --bar-dim:rgba(238,241,244,.6); --bar-line:rgba(238,241,244,.14);
  --pic:#C9D1D9; --scrim:rgba(8,11,14,.5);
  --display:"Saira Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sticky-top:0px; --bar-pad:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1014; --surface:#151B21; --raised:#1C232B; --ink:#E6EAEE; --muted:#93A0AC; --line:#26303A;
  --se:#FFD21F; --se-ink:#FFD84A; --on-se:#11161B;
  --bot:#FF6B5E; --bug:#F5A524; --squid:#A98CFF; --mission:#5DB3D9;
  --bot-soft:#3A1C19; --bug-soft:#3A2A12; --squid-soft:#271F42; --mission-soft:#13303D;
  --good:#4CC38A; --good-soft:#123324; --warn:#F5B13D; --warn-soft:#3A2A10; --bad:#FF7A6B; --bad-soft:#3D1A16;
  --bar-bg:#151B21; --bar-ink:#E6EAEE; --bar-dim:rgba(230,234,238,.58); --bar-line:rgba(230,234,238,.14);
  --pic:#2B353F; --scrim:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1014; --surface:#151B21; --raised:#1C232B; --ink:#E6EAEE; --muted:#93A0AC; --line:#26303A;
  --se:#FFD21F; --se-ink:#FFD84A; --on-se:#11161B;
  --bot:#FF6B5E; --bug:#F5A524; --squid:#A98CFF; --mission:#5DB3D9;
  --bot-soft:#3A1C19; --bug-soft:#3A2A12; --squid-soft:#271F42; --mission-soft:#13303D;
  --good:#4CC38A; --good-soft:#123324; --warn:#F5B13D; --warn-soft:#3A2A10; --bad:#FF7A6B; --bad-soft:#3D1A16;
  --bar-bg:#151B21; --bar-ink:#E6EAEE; --bar-dim:rgba(230,234,238,.58); --bar-line:rgba(230,234,238,.14);
  --pic:#2B353F; --scrim:rgba(0,0,0,.62); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg)}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--se);outline-offset:2px;border-radius:8px}
a{color:inherit}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}

/* command bar */
.bar{position:sticky;top:var(--sticky-top);z-index:6;background:var(--bar-bg);color:var(--bar-ink);
  padding-top:calc(var(--bar-pad) + 6px);padding-bottom:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar-inner{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.back{display:flex;align-items:center;gap:2px;font-weight:600;min-height:44px;padding-right:6px;color:var(--bar-ink)}
.back svg{width:22px;height:22px}
.title{font:800 25px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{color:var(--se);font-weight:800}
.bar-meta{font:500 11px/1.2 var(--mono);color:var(--bar-dim);text-align:right}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar-bg);border-top:1px solid var(--bar-line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;min-height:56px;color:var(--bar-dim);text-decoration:none;
  font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--se)}

/* shared bits */
.eyebrow{font:700 13px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.eyebrow span{letter-spacing:.04em;text-transform:none;font:500 12px/1.2 var(--mono)}
h2,h3{text-wrap:balance}
.k-bot{--k:var(--bot);--k-soft:var(--bot-soft)} .k-bug{--k:var(--bug);--k-soft:var(--bug-soft)}
.k-squid{--k:var(--squid);--k-soft:var(--squid-soft)} .k-mission{--k:var(--mission);--k-soft:var(--mission-soft)}
.panel{background:var(--surface);border-radius:14px;padding:14px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--k,var(--ink));border-color:var(--k,var(--ink));color:var(--surface)}
.tag{display:inline-flex;align-items:center;font:600 10.5px/1 var(--mono);letter-spacing:.02em;padding:3px 6px;border-radius:5px;
  background:var(--raised);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--se);color:var(--on-se)}
.tag.ap{background:var(--raised);color:var(--ink)}
.tag.ap5,.tag.ap6,.tag.ap7,.tag.ap8,.tag.ap9{background:var(--bad-soft);color:var(--bad)}
.tag.ap4{background:var(--warn-soft);color:var(--warn)}
.tag.ap3{background:var(--good-soft);color:var(--good)}
.tag.pick{background:var(--good-soft);color:var(--good)}
.tag.weak{background:var(--bad-soft);color:var(--bad)}
.tag.alt{background:var(--raised);color:var(--muted)}
.tag.pack{background:var(--mission-soft);color:var(--mission)}
.tag.at{background:var(--ink);color:var(--surface)}
.callout.cover{margin-top:12px;background:var(--surface);border:1px solid var(--line)}
.callout.cover strong{color:var(--ink)}
.callout.cover li b{font-weight:650}
.code{font:600 13px/1 var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.pic{flex:none;width:64px;height:44px;border-radius:9px;background:var(--pic);display:grid;place-items:center;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pic.sq{width:44px;height:44px;background:transparent}
.pic.sq img{border-radius:6px}
.pic.none{color:var(--muted);font:700 12px/1 var(--display)}
.muted{color:var(--muted)}
.callout{border-radius:12px;padding:11px 13px;background:var(--k-soft,var(--raised));font-size:14px;display:grid;gap:4px}
.callout strong{color:var(--k,var(--ink));font:700 13px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase}
.callout ul{margin:0;padding-left:18px;display:grid;gap:3px}

/* home: faction tiles */
.ftiles{display:grid;gap:10px}
.ftile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px 13px;border-radius:16px;background:var(--surface);
  border-left:6px solid var(--k);position:relative;overflow:hidden}
.ftile:active{background:var(--raised)}
.ftile h2{margin:0;font:800 34px/.95 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--k)}
.ftile .nick{font:600 12px/1 var(--mono);color:var(--muted);align-self:start;padding-top:4px}
.ftile p{margin:2px 0 0;grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.ftile .subs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.doctrine{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.doctrine li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:14px;align-items:baseline}
.doctrine b{font:700 13px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--k,var(--ink))}
.nlist{display:grid;gap:10px;margin:0;padding:0;list-style:none;font-size:14px}
.nlist li{display:grid;gap:2px}
.nlist b{font:700 14px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}

/* faction header + threat brief */
.fhead{margin-top:6px;padding:14px 16px;border-radius:16px;background:var(--k);color:var(--surface)}
.fhead h2{margin:0;font:800 40px/.9 var(--display);text-transform:uppercase;letter-spacing:.02em}
.fhead p{margin:6px 0 0;font-size:14px;opacity:.95}
.brief{margin-top:10px;background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.brief h3{margin:0;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--k)}
.brief .tagline{margin:-4px 0 0;font-size:14px}
.need{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.need div{background:var(--raised);border-radius:10px;padding:8px 9px;min-width:0}
.need dt{font:700 11px/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.need dd{margin:3px 0 0;font:700 15px/1.15 var(--display);letter-spacing:.02em;overflow-wrap:anywhere}
.foes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.foes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.foes li:first-child{border-top:0;padding-top:0}
.foes .fn{font-weight:650}
.foes .fa{font:600 12px/1.3 var(--mono);color:var(--muted);text-align:right}
.foes .fx{grid-column:1/-1;color:var(--muted);font-size:13px}
.tips{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.tips li::marker{color:var(--k)}
.brief .rows.bring{background:var(--raised)}

/* loadout cards */
.lcards{display:grid;gap:10px}
.lcard{display:block;width:100%;background:var(--surface);border-radius:16px;padding:13px 14px 12px;position:relative}
.lcard:active{background:var(--raised)}
.lcard-body{display:block;color:inherit;text-decoration:none}
.lcard-top{display:flex;align-items:flex-start;gap:8px;padding-right:40px}
.lcard h3{margin:0;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.lcard .role{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.lcard .strip{display:flex;gap:6px;margin-top:10px}
.lcard .strip img,.lcard .strip .ph{width:44px;height:44px;border-radius:6px;display:block}
.lcard .strip .ph{background:var(--raised)}
.lcard .gear{margin-top:8px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lcard .gear b{color:var(--ink);font-weight:650}
.lcard .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fav{position:absolute;top:6px;right:6px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.fav svg{width:24px;height:24px}
.fav[aria-pressed="true"]{color:var(--se-ink)}
.fav[aria-pressed="true"] svg{fill:currentColor}

/* loadout detail */
.lhead{margin-top:6px;border-radius:16px;padding:14px 16px;background:var(--surface);border-top:5px solid var(--k);position:relative}
.lhead h2{margin:0;padding-right:44px;font:800 34px/.95 var(--display);text-transform:uppercase;letter-spacing:.02em}
.lhead .ctx{font:600 12px/1.2 var(--mono);color:var(--k);text-transform:uppercase;letter-spacing:.04em}
.lhead p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--raised);font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--se);color:var(--on-se)}
.btn svg{width:20px;height:20px}
.slot{margin-top:14px}
.slot-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 6px;
  font:700 14px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slot-label i{font:500 12px/1.2 var(--mono);font-style:normal;letter-spacing:0;text-transform:none}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.rows li{display:flex;align-items:stretch}
.rows li+li{border-top:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:9px 4px 9px 12px;min-height:62px}
.row-main:active{background:var(--raised)}
.row-text{min-width:0;display:grid;gap:4px}
.row-name{font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.row-sub{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.row-note{font-size:12.5px;color:var(--muted);line-height:1.3}
.rows li.weak .row-name{color:var(--muted)}
.rows li.weak .pic{opacity:.55}
.like{flex:none;width:48px;display:grid;place-items:center;color:var(--line)}
.like svg{width:22px;height:22px}
.like[aria-pressed="true"]{color:var(--bad)}
.like[aria-pressed="true"] svg{fill:currentColor}
.syn{margin:6px 2px 0;font-size:13px;color:var(--mission);display:flex;gap:6px}
.syn svg{flex:none;width:16px;height:16px;margin-top:2px}

/* roll */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:12px;padding:3px;gap:3px}
.seg button{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;border-radius:9px;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--k);color:var(--surface)}
.opts{display:grid;gap:2px;margin-top:10px;background:var(--surface);border-radius:14px;padding:4px 14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-size:14.5px}
.opt+.opt{border-top:1px solid var(--line)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.rollbtn{width:100%;margin-top:14px;min-height:60px;border-radius:14px;background:var(--se);color:var(--on-se);
  font:800 26px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px}
.rollbtn .code{color:var(--on-se);opacity:.6;font-size:15px}
.rollbtn:active{transform:scale(.99)}
.result{margin-top:14px;background:var(--surface);border-radius:16px;padding:14px}
.result-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.result-head h3{margin:0;font:800 21px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.result-head span{font:500 12px/1.2 var(--mono);color:var(--muted);text-align:right}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.scell{min-width:0;display:grid;gap:5px;justify-items:center;text-align:center;position:relative}
.scell .sicon{width:100%;aspect-ratio:1;max-width:76px;border-radius:9px;overflow:hidden;background:var(--raised);display:grid;place-items:center}
.scell .sicon img{width:100%;height:100%;object-fit:contain;display:block}
.scell .sname{font:700 13.5px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.scell .code{font-size:11px;letter-spacing:0}
.scell .ctl{display:flex;gap:2px}
.scell .ctl button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.scell .ctl button svg{width:18px;height:18px}
.scell .ctl button[aria-pressed="true"]{background:var(--se);color:var(--on-se)}
.scell.fixed .sicon{outline:2px solid var(--mission);outline-offset:1px}
.grows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.grows li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:44px;border-top:1px solid var(--line)}
.grows li b{font:700 12px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grows li span{min-width:0;font-weight:600;overflow-wrap:anywhere}
.grows li button{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.grows li button svg{width:18px;height:18px}
.warns{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.warns li{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--mission-soft);color:var(--ink)}
.warns li.w{background:var(--warn-soft)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.hist img{width:32px;height:32px;border-radius:5px}
.hist span{margin-left:auto;font:500 11px/1.2 var(--mono);color:var(--muted);text-align:right}

/* in-view tabs */
.vtabs{display:flex;gap:4px;margin:14px 0 4px;background:var(--surface);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtab{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-align:center;min-height:40px;padding:0 12px;border-radius:9px;font:700 15px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.vtab i{font:600 11px/1 var(--mono);font-style:normal;letter-spacing:0;opacity:.8}
.vtab[aria-selected="true"]{background:var(--k,var(--ink));color:var(--surface)}
/* randomizer call to action */
.cta{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;margin-top:10px;padding:14px 16px;border-radius:16px;
  background:var(--se);color:var(--on-se);text-decoration:none}
.cta svg{width:40px;height:40px}
.cta b{display:block;font:800 24px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.cta small{display:block;margin-top:4px;font-size:13px;line-height:1.3}
.cta:active{transform:scale(.99)}
.fhead .btn{margin-top:12px;background:var(--surface);color:var(--ink)}
/* preview build: tabs live in the top bar, since the viewer can cover the bottom edge */
body.nav-top .tabs{position:static;border-top:1px solid var(--bar-line);padding:0;margin-top:6px;background:transparent}
body.nav-top .tab{min-height:46px;padding:6px 0 4px}
body.nav-top .tab svg{width:20px;height:20px}
body.nav-top .wrap{padding-bottom:32px}

/* armory */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;min-height:44px}
.count{font:500 12px/1.2 var(--mono);color:var(--muted);margin:8px 2px}

/* intel */
.verdicts{display:grid;gap:6px;margin-top:8px}
.verdict{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:baseline}
.vchip{font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:5px;text-align:center}
.vchip.strong{background:var(--good-soft);color:var(--good)} .vchip.situational{background:var(--warn-soft);color:var(--warn)} .vchip.skip{background:var(--raised);color:var(--muted)}
.icard{background:var(--surface);border-radius:14px;padding:12px 14px}
.icard + .icard{margin-top:8px}
.icard-top{display:flex;gap:11px;align-items:center}
.icard h3{margin:0;font:800 19px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.icard p{margin:8px 0 0;font-size:14px}
.prose{font-size:14px}
.prose p{margin:0 0 8px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:5px}
.data{display:grid;gap:10px}
.data .row{display:flex;gap:8px;flex-wrap:wrap}
.data textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--ink);
  font:13px/1.35 var(--mono);padding:8px}
.data .msg{font-size:13px;color:var(--muted);margin:0}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.rollbtn:active{transform:none}}
.sheet-inner{max-width:580px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 6px}
.sheet-top{display:flex;justify-content:flex-end}
.close{min-height:44px;padding:0 6px;font-weight:700;color:var(--muted)}
.hero{background:var(--pic);border-radius:14px;display:grid;place-items:center;height:190px;overflow:hidden}
.hero img{max-width:92%;max-height:176px;object-fit:contain}
.hero.sq img{max-height:120px;border-radius:12px}
.sheet h2{margin:14px 0 4px;font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.sheet .full{font:500 12.5px/1.3 var(--mono);color:var(--muted);margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stats{margin:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:var(--raised);border-radius:10px;padding:8px 10px;min-width:0}
.stats dt{font:700 11px/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:4px 0 0;font:600 14px/1.25 var(--mono);overflow-wrap:anywhere}
.stats .wide{grid-column:1/-1}
.sheet h4{margin:16px 0 6px;font:700 13px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.inlo{display:flex;flex-wrap:wrap;gap:6px}
.inlo button{min-height:36px;padding:0 11px;border-radius:999px;background:var(--k-soft);color:var(--k);font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.sheet-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet-actions a{text-decoration:none}
</style>
</head>

r.webp","armor":75,"speed":550,"stamina":125,"passive":"Unflinching"},"uf-50-bloodhound":{"name":"UF-50 Bloodhound","short":"Bloodhound","kind":"armor","sub":"Medium","source":"Truth Enforcers","srcPage":"P2","date":"2024-10-31","page":"UF-50 Bloodhound","img":"uf-50-bloodhound.webp","armor":125,"speed":500,"stamina":100,"passive":"Unflinching"},"uf-84-doubt-killer":{"name":"UF-84 Doubt Killer","short":"Doubt Killer","kind":"armor","sub":"Medium","source":"Superstore","page":"UF-84 Doubt Killer","img":"uf-84-doubt-killer.webp","armor":125,"speed":500,"stamina":100,"passive":"Unflinching"}},"passives":{"Acclimated":"Provides 50% resistance to fire, gas, acid, and electrical damage.","Adreno-Defibrillator":"Provides one-time, short-lived resuscitation upon death, given that the Helldiver's body is still intact. Increases stim effect duration by 2.0s. Provides 50% resistance to arc damage.","Advanced Filtration":"Provides 80% resistance to gas damage and effects.","Ballistic Padding":"Provides 25% resistance to chest damage. Provides 25% resistance to explosive damage. Prevents all damage from bleeding if chest hemorrhages.","Blunt-Force Mitigation":"Bearer is more resistant to being knocked prone. Reduces damage taken from impact and collisions by 30%. Provides a higher armor rating.","Concussive Padding, Grenadier":"Provides 50% resistance to explosive damage. Increases initial inventory and holding capacity of throwables by +2.","Concussive Padding, Hazmat":"Provides 50% resistance to explosive damage. Provides 25% resistance to gas damage and effects. Sidearm recoil reduced by 30%.","Concussive Padding, Reinforced":"Provides 50% resistance to explosive damage. Provides a higher armor rating.","Democracy Protects":"50% chance to not die when taking lethal damage. Prevents all damage from bleeding if chest hemorrhages.","Desert Stormer":"Provides 40% resistance to fire, gas, acid, and electrical damage. Increases throwing range by 20%.","Electrical Conduit":"Provides 95% resistance to arc damage.","Engineering Kit":"Further reduces recoil when crouching or prone by 30%. Increases initial inventory and holding capacity of throwables by +2.","Extra Padding":"Provides a higher armor rating.","Feet First":"Wearer makes 50% less noise when moving. Increases point-of-interest identification range by 30%. Provides immunity to leg injuries.","Fortified":"Further reduces recoil when crouching or prone by 30%. Provides 50% resistance to explosive damage.","Gunslinger":"Increases sidearms reload speed by 40%. Sidearm draw/holster speed increased by 50%. Sidearm recoil reduced by 70%.","Inflammable":"Provides 75% damage resistance to fire, allowing bearer to rest assured in their inflammability.","Integrated Explosives":"Armor explodes 1.5s after the wearer dies. Increases initial inventory and holding capacity of throwables by +2.","Kinetic Displacement Mitigation":"Provides 50% damage resistance to fire, allowing bearer to rest assured in their inflammability. Gives the wearer a 50% chance to avoid grievous limb injury. Reduces damage taken from impact and collisions by 30%.","Med-Kit":"Increases initial inventory and holding capacity of stims by +2. Increases stim effect duration by 2.0s.","Oxygenator":"Increases the wearer's walking speed and running speed. Increases the speed and duration of slides.","Peak Physique":"Increases melee damage by 40%. Improves weapons handling with less drag on weapon movement.","Reduced Signature":"Wearer makes 50% less noise when moving. Reduces range at which enemies can detect the wearer by 40%.","Reinforced Epaulettes":"Increases reload speed of primary weapons by 30%. Gives wearer a 50% chance to avoid grievous limb injury. Increases melee damage by 20%.","Rock Solid":"Increases melee damage by 40%. Bearer is more resistant to being knocked prone.","Scout":"Markers placed on the map will generate radar scans every 2.0s. Reduces range at which enemies can detect the wearer by 30%.","Servo-Assisted":" places the Counter Sniper or Eruptor."}],"secondary":[{"id":"gp-20-ultimatum","note":"Your fallback for tanks and Titans."},{"id":"p-34-breacher","note":"Your fallback for tanks and Titans."}],"throwable":[{"id":"g-142-pyrotech"},{"id":"g-4-gas"},{"id":"g-123-thermite","tag":"alt","note":"2026 bot consensus pick; your secondary already covers tanks."},{"id":"g-60-anti-tank-seeker","tag":"alt","note":"Homing anti-tank drone: one kills a Hulk with a torso hit and usually pops a fabricator."}],"slots":[{"label":"Anti-tank","hint":"","options":[{"id":"gr-8-recoilless-rifle"},{"id":"las-99-quasar-cannon"},{"id":"amw-20-apex","tag":"new","note":"One-shots Hulk weak spots; backpack."}]},{"label":"Shield / backup","hint":"Recoilless and Apex take the pack","options":[{"id":"sh-32-shield-generator-pack"},{"id":"a-mls-4x-rocket-sentry"},{"id":"e-at-12-anti-tank-emplacement"}]},{"label":"Orbital","hint":"","options":[{"id":"orbital-laser"},{"id":"orbital-ems-strike"},{"id":"orbital-120mm-he-barrage"},{"id":"orbital-airburst-strike"}]},{"label":"Eagle","hint":"","options":[{"id":"eagle-500kg-bomb"},{"id":"eagle-airstrike"},{"id":"eagle-strafing-run"},{"id":"eagle-smoke-strike"}]}],"notes":["Team-load the Recoilless when a runner is nearby."],"armor":{"weight":["Medium"],"passives":["Fortified"],"sets":[{"id":"b-24-enforcer"}]}}]}],"synergies":[{"items":["gl-21-grenade-launcher","mg-206-heavy-machine-gun"],"needs":"b-1-supply-pack","why":"Only 40 grenades / 2 spare drums: without the pack they run dry fast."},{"title":"Recoil","passives":["Fortified","Engineering Kit"],"items":["mg-43-machine-gun","mg-206-heavy-machine-gun","m-105-stalwart","m-1000-maxigun"],"why":"-30% vertical recoil, best crouched or prone."},{"title":"Sway","passives":["Stationary Shroud"],"items":["r-40-sightliner","amw-20-apex","las-44-nova","apw-1-anti-materiel-rifle","r-63cs-diligence-counter-sniper","r-72-censor"],"why":"-35% sway and concealment while still and crouched. The Apex fires crouched anyway. No explosive resistance, so pure overwatch only vs bots."},{"title":"Support reload","passives":["True Grit"],"items":["gr-8-recoilless-rifle","faf-14-spear","ac-8-autocannon","amw-20-apex","sta-x3-w-a-s-p-launcher","gl-21-grenade-launcher","mg-206-heavy-machine-gun"],"why":"+30% support-weapon reload (not assisted reloads) and better handling."},{"title":"Sidearm recoil","passives":["Gunslinger","Concussive Padding, Hazmat"],"items":["p-40-k-bolt-pistol","p-34-breacher","p-33-missile-pistol"],"why":"Gunslinger -70%, Hazmat -30% sidearm recoil. The Bolt Pistol kicks harder than anything in the game."},{"title":"More ammo","passives":["Siege-Ready"],"items":["mg-206-heavy-machine-gun","mp-98-knight","smg-flam-34-stoker","smg-203-gallant","sg-225ie-breaker-incendiary"],"why":"+20% ammo on non-backpack weapons (the HMG gets a third drum) and faster primary reloads."},{"title":"Explosive self-splash","passives":["Fortified","Concussive Padding, Reinforced","Concussive Padding, Grenadier","Concussive Padding, Hazmat"],"items":["r-36-eruptor","cb-9-exploding-crossbow","plas-101-purifier","gl-21-grenade-launcher","gl-15-evictor","gp-20-ultimatum"],"why":"Halves your own splash, in caves and up close."},{"title":"Fire","passives":["Inflammable"],"items":["flam-66-torcher","smg-flam-34-stoker","sg-451-cookout","las-17-double-edge-sickle","flam-40-flamethrower","b-flam-80-cremator","orbital-napalm-barrage","eagle-napalm-airstrike","md-i4-incendiary-mines"],"why":"75% fire resistance: safe in your own flames. Also strong vs Incineration Corps."},{"title":"Gas","passives":["Advanced Filtration","Concussive Padding, Hazmat"],"items":["g-4-gas","orbital-gas-strike","ax-tx-13-dog-breath","a-gm-17-gas-mortar-sentry","md-8-gas-mines","eagle-gas-airstrike"],"why":"Gas slows you too since April; resistance keeps your own cloud from hurting you."},{"title":"Arc","passives":["Electrical Conduit"],"items":["arc-12-blitzer","arc-3-arc-thrower","gl-52-de-escalator","a-arc-3-tesla-tower"],"why":"95% arc resistance; the De-Escalator's arc can hit you since September."},{"title":"Stealth","passives":["Reduced Signature","Feet First"],"items":["lift-850-jump-pack","r-72-censor"],"why":"-50% noise; Reduced Signature also -40% detection range. Makes the Jump Pack silent (Commando)."},{"title":"Extra throwables","passives":["Engineering Kit","Concussive Padding, Grenadier","Integrated Explosives"],"items":["g-123-thermite","g-7-pineapple","g-60-anti-tank-seeker"],"why":"+2 throwables (Thermite 3 → 5)."},{"title":"Backpack weapons","items":[],"why":"A Recoilless, Spear, Autocannon, Airburst or W.A.S.P. takes the backpack slot, so you cannot also wear a Supply Pack. Since August a loader can team-reload you if either of you wears the pack."}],"intel":{"sheetDate":"2026-03-26","newgear":[{"item":"r-40-sightliner","summary":"Scope of Authority bolt-action, Heavy pen, 350 damage. Day one: numbers say yes, players are split.","verdict":{"automatons":["situational","Passes your bar on paper (Devastator heads one shot, Hulk eye two); day-one feedback mixed. Test it."],"terminids":["skip","No horde clear."],"illuminate":["situational","Appropriators only: hurts Gatekeeper plating; Mindless Masses swarm it."]}},{"item":"amw-20-apex","summary":"Anti-materiel backpack rifle, Anti-Tank I, 1,550 damage, 5-round mags. Fire crouched or prone.","verdict":{"automatons":["strong","One-shots Hulk weak spots, turrets and AA. Costs the backpack slot (no Supply, Shield or Warp)."],"terminids":["skip","Static and prone; you play light and mobile vs bugs."],"illuminate":["situational","Appropriators: full pen on Gatekeeper armor; breakpoints unknown."]}},{"item":"las-44-nova","summary":"Charge laser sniper: 880 damage, Anti-Tank I, infinite ammo, no backpack.","verdict":{"automatons":["strong","Keeps your backpack free and never runs dry. One-shots Hulk eyes and turrets. Great for Commando."],"terminids":["situational","One-shots Alpha Commander weak spots; too slow for swarms."],"illuminate":["situational","Promising vs Gatekeeper and Veracitor weak spots; untested."]}},{"item":"p-40-k-bolt-pistol","summary":"Castellan's Creed sidearm: 325 Heavy-pen bolts plus a 175 explosion. Brutal recoil.","verdict":{"automatons":["strong","The pick when your support weapon already covers tanks: Senator upgrade, and Fortified tames the recoil."],"terminids":["situational","Strong on elites, but doesn't close bug holes."],"illuminate":["strong","One-shots Overseer weak spots, cracks Crusher helmets, chips Gatekeepers."]}},{"item":"p-34-breacher","summary":"Sticky thermite pistol: 2,000 explosion at Anti-Tank III, 3 rounds per life. Already one of your two fallback sidearms.","verdict":{"automatons":["strong","Your tank and Factory Strider fallback; also one-shots Hulks and fabricators."],"terminids":["situational","Kills Charger rears; the Grenade Pistol still closes holes."],"illuminate":["situational","Breakpoints vs Harvesters and Gatekeepers unknown."]}},{"item":"g-60-anti-tank-seeker","summary":"Homing anti-tank drone grenade, 1,800 explosion, 3 max.","verdict":{"automatons":["situational","One kills a Hulk; you keep Pyrotech / Gas and leave tanks to the sidearm, so it is a swap-in, not a default."],"terminids":["situational","Doesn't target bug holes; unreliable on Titans."],"illuminate":["situational","Unknown vs Harvesters."]}},{"item":"40-k-meltagun","summary":"Short-range melta beam: 2,600 DPS at Anti-Tank III, 15 m range, no backpack.","verdict":{"automatons":["situational","Deletes tanks and Hulks, but at 15 m; your bot style is ranged."],"terminids":["strong","Chargers anywhere in 1-2 bursts, no backpack: fits light, mobile kits."],"illuminate":["strong","Mindless Masses: Fleshmobs and Warp Ships. Risky vs charging Veracitors."]}},{"item":"gl-15-evictor","summary":"Pump grenade launcher primary: 440 explosion, Medium pen, 4-round tube.","verdict":{"automatons":["situational","Your Eruptor and Purifier already cover it; Berserker limbs ignore explosions."],"terminids":["strong","One round closes a hole; wipes Pouncer packs; forces Rupture burrowers up. Mind self-damage."],"illuminate":["skip","Appropriator mech limbs are explosion-immune."]}},{"item":"smg-203-gallant","summary":"Exo Experts SMG: Medium pen, 1,380 rpm, one-handed. Ammo-hungry.","verdict":{"automatons":["situational","Better than the Knight, but thirsty at range."],"terminids":["situational","Handles Hive Guard heads."],"illuminate":["strong","Appropriators: exactly the Medium-pen, high-rate gun you want for Overseers and Obtruders."]}},{"item":"mgx-42-bullet-storm","summary":"Two disposable 300-round machine guns per call, 70 s cooldown, Light pen.","verdict":{"automatons":["skip","Not effective vs bots."],"terminids":["situational","Competes with your Stalwart and MG-43."],"illuminate":["strong","Mindless Masses and Vote Snatchers: shreds Voteless and Wretches. Skip vs Appropriators."]}},{"item":"exo-51-lumberer-exosuit","summary":"Anti-tank cannon plus a flamethrower (flame damage buffed today).","verdict":{"automatons":["situational","Fine, but loud."],"terminids":["strong","Fire plus AT in your \"Exosuit (any)\" slot."],"illuminate":["situational","Both variants: OK."]}},{"item":"exo-55-breakthrough-exosuit","summary":"Flak cannon (Heavy pen) plus a ballistic-shield arm.","verdict":{"automatons":["situational","Pen tops out at AP4."],"terminids":["strong","Kills a Charger in 2-3 close shots; \"very solid for Terminids\"."],"illuminate":["situational","Good matchup, but watch the lasers."]}},{"item":"eagle-gas-airstrike","summary":"Campaign reward (Counterdissident Hammer), one of your favourite eagles: a carpet of gas that confuses and slows.","verdict":{"automatons":["situational","Hinders bot drops."],"terminids":["strong","Fits your gas kit; scatters Predator Strain."],"illuminate":["strong","Mindless Masses: alternative to the Orbital Gas Strike."]}},{"item":"p-33-missile-pistol","summary":"Lock-on missile sidearm, 1,000 Anti-Tank I impact, closes holes and fabricators.","verdict":{"automatons":["situational","Gunship and turret insurance; Bolt Pistol or Breacher fit better."],"terminids":["situational","Closes holes, kills Charger rears."],"illuminate":["strong","One-shots Stingrays (Invasion Fleet planets)."]}},{"item":"g-11-caltrops","summary":"Scope of Authority stun-mine field. Day one: \"meh\" next to smoke.","verdict":{"automatons":["situational","A flank alarm for Berserker lanes; Gas and Pyrotech still do more."],"terminids":["situational","Chokepoints; buys shots on Predator runners."],"illuminate":["situational","Unknown vs Obtruders."]}},{"item":"ss-15-focal-point","summary":"Medium armor with Stationary Shroud: -35% weapon sway, concealment while still and crouched.","verdict":{"automatons":["situational","Only for pure overwatch with the new snipers. No explosive resistance, and bot rockets got Heavy pen this year."],"terminids":["skip","Medium, and bugs hunt you down anyway."],"illuminate":["situational","Mindless Masses only; Appropriators want explosive resistance."]}},{"item":"tg-8-sharpshooter","summary":"Medium armor with True Grit: +30% support-weapon reload, better handling.","verdict":{"automatons":["situational","Only for solo Recoilless or Apex reload builds."],"terminids":["situational","Cave build loses the explosive resistance."],"illuminate":["situational","Mindless Masses support builds."]}},{"item":"r-40-k-hot-shot-marksman-rifle","summary":"Castellan's Creed marksman: Medium pen, 12 rounds, cleaves through light enemies.","verdict":{"automatons":["situational","Only partly passes your bar: Devastator and Berserker heads yes, Hulk eyes no."],"terminids":["skip",""],"illuminate":["situational","Cleaves Voteless; meets Appropriators' minimum."]}},{"item":"cph-26-commandant-armor","summary":"Older (Entrenched Division) light armor: 50% explosive + 25% gas resistance, -30% sidearm recoil.","verdict":{"automatons":["skip",""],"terminids":["strong","Your cave Grenade Launcher build at light weight, safe in your own gas."],"illuminate":["skip",""]}},{"item":"sg-97-sweeper","summary":"Older Superstore shotgun: Medium pen, 504 damage, slam-fire.","verdict":{"automatons":["skip",""],"terminids":["situational",""],"illuminate":["strong","Appropriators: can one-shot Obtruders and kills Overseers fast."]}}],"patches":["7.2.0 (today): Breaker damage 330 → 396. Sickle and Double-Edge Sickle spin up faster (0.5 → 0.33 s). Maxigun: no movement lock, more stagger. Orbital Airburst cooldown 100 → 90 s. Caustic Strain is its own bug variant now.","7.2.0: Eagle Gas Airstrike demolition 50 → 40. Lumberer flamer damage 3 → 8. Supply FRV buyable for 25,000 Requisition Slips.","7.1.0 (Sep 22): Trident vertical recoil 12 → 2.","7.0.0 (Aug 12): Eagle Napalm radius 8 → 10 m. Team reload works if either player wears the backpack. More short-mag ammo for Liberators, Stoker and Breakers. Vote Snatchers arrive. Gatekeepers spawn as often as Veracitors.","6.3.0 (Jun 16): all sentries +100% HP. Exosuits 1,800 HP and 420 s cooldown (was 600 s): worth a re-test. Orbital 120mm HE buffed. Pineapple 4 at start, 5 max. Bot rockets now explode at Heavy pen.","6.2.2 (Apr 28): tank vents 750 → 1,500 HP and AV4, so AP3 primaries no longer hurt tanks. Spear 3 → 4 missiles. Heavy Devastator shield breakable (800 HP, AV4). Gas slows confused enemies 25% and you too.","Unchanged since your sheet: Eruptor, Purifier, Ultimatum, Grenade Pistol, Recoilless, Quasar, Orbital Gatling."],"sources":"research/new-gear.md, factions.md, mission-types.md, patches-and-meta.md in the project folder."},"doctrine":[{"label":"Bots","k":"bot","text":"Medium armor with 50% explosive resistance (Fortified / Concussive Padding). Heavy only for Defense."},{"label":"Bugs","k":"bug","text":"Light armor for speed. Heavy only for Defense."},{"label":"Squids","k":"squid","text":"Medium armor. Light pen is fine, except Appropriators: Veracitors want AP3, Gatekeepers AP4+ or anti-tank."},{"label":"Rule","text":"Single-shot weapons only when they hold up against bots. AMW-20 Apex passes; the R-40 Sightliner passes on paper (mixed day one); Hot-Shot and Hyena only partly (no Hulk eyes)."},{"label":"Rule","text":"Always an answer to heavy armor. Bots and bugs need anti-tank, squids AP4+."},{"label":"Sidearm","text":"Breacher or Ultimatum almost always: the fallback for tanks and Titans. A real anti-tank support weapon frees the slot."},{"label":"Throw","text":"Pyrotech and Gas on every front. Gas buys a breather and makes bots shoot each other; Pyrotech is the AoE."},{"label":"Strikes","text":"At least one orbital and one eagle (bots on Megafactories: a 2nd orbital instead; Commando exempt). Orbitals: Laser, 120mm, Walking, Airburst, Gatling, Napalm. Eagles: 500 kg, Napalm, Gas, Strafing, Airstrike."},{"label":"Niche","text":"Emplacements (AT, HMG, Grenadier) show up in at most 1 roll in 5."},{"label":"Drone","text":"Bugs: gas drone whenever the pack is free. Squids: laser or Liberator drone. Bots: Liberator drone with a single-shot primary, for close swarms."},{"label":"Rule","text":"Ammo-hungry support weapons (Grenade Launcher, HMG) bring a Supply Pack."}],"missionNotes":[{"title":"Stratagem Jammer","text":"No stratagems within 150 m. Kill it from outside: Hellbomb, or an Orbital Walking Barrage thrown just outside that walks in."},{"title":"AA Emplacement","text":"No Eagles within 150 m; if Eagle-1 flies into its coverage, all your Eagles go to rearm. AP4+ weapons or orbitals kill it."},{"title":"Ion Storm","text":"During the storm: no new stratagems, not even Reinforce. Call key gear early."},{"title":"Hive World caves","text":"No stratagems under cover except Reinforce. Bring support weapons in with you; the Orbital Laser no longer targets enemies in caves."},{"title":"Illuminate Lair","text":"One objective needs the Video Camera, which takes the support-weapon slot for a while."},{"title":"Operation modifiers","text":"Complex Stratagem Plotting: +50% call-in time. Orbital Fluctuations: +25% cooldowns."},{"title":"Gloom","text":"Slower Eagle rearm; heavy Gloom halves ammo pickups, which favors ammo-free support weapons."}],"heavy":{"need":{"automatons":"at","terminids":"at","illuminate":"heavy","missions":"at"},"label":{"at":"Anti-tank","heavy":"Heavy pen"},"why":{"at":"Tanks, Factory Striders, Bile Titans and Chargers need anti-tank (AP6+) or ordnance.","heavy":"Harvesters, Gatekeepers and Crusher helmets need heavy pen (AP4+) or anti-tank."},"at":["gr-8-recoilless-rifle","faf-14-spear","las-99-quasar-cannon","eat-17-expendable-anti-tank","eat-411-leveller","ms-11-solo-silo","mls-4x-commando","sta-x3-w-a-s-p-launcher","40-k-meltagun","b-md-c4-pack","e-at-12-anti-tank-emplacement","orbital-laser","orbital-railcannon-strike","eagle-500kg-bomb","orbital-precision-strike","b-100-portable-hellbomb","exo-45-patriot-exosuit","exo-51-lumberer-exosuit","td-220-bastion-mk-xvi","td-110-maelstrom","gp-20-ultimatum","p-34-breacher","g-123-thermite","g-40-k-melta-mine","g-60-anti-tank-seeker"],"heavy":["ac-8-autocannon","las-98-laser-cannon","mg-206-heavy-machine-gun","apw-1-anti-materiel-rifle","rs-422-railgun","amw-20-apex","las-44-nova","s-11-speargun","flam-40-flamethrower","b-flam-80-cremator","arc-3-arc-thrower","gl-28-belt-fed-grenade-launcher","exo-49-emancipator-exosuit","exo-55-breakthrough-exosuit","a-ac-8-autocannon-sentry","a-mls-4x-rocket-sentry","e-mg-101-hmg-emplacement","eagle-airstrike","p-4-senator","p-40-k-bolt-pistol","p-33-missile-pistol","r-36-eruptor","las-17-double-edge-sickle","r-40-sightliner"]},"prefer":{"secondary":{"items":["gp-20-ultimatum","p-34-breacher"],"share":0.8,"why":"Your fallback: kills tanks, Factory Striders, Chargers and Titans when the support weapon can't."},"throwable":{"items":["g-142-pyrotech","g-4-gas"],"share":0.8,"why":"Gas buys a breather and makes bots shoot each other; Pyrotech is the AoE. Works on every front."}},"strikes":{"orbital":["orbital-laser","orbital-120mm-he-barrage","orbital-walking-barrage","orbital-airburst-strike","orbital-gatling-barrage","orbital-napalm-barrage"],"eagle":["eagle-500kg-bomb","eagle-napalm-airstrike","eagle-gas-airstrike","eagle-strafing-run","eagle-airstrike"],"exempt":["commando"],"why":"At least one orbital and one eagle in every loadout.","megafactory":"Bots on Megafactories: AA everywhere blocks eagles within 150 m, so the eagle slot takes a second orbital."},"rare":{"items":["e-at-12-anti-tank-emplacement","e-mg-101-hmg-emplacement","e-gl-21-grenadier-battlement"],"share":0.2,"label":"Niche","why":"Emplacements are niche: they show up in at most 1 roll in 5."},"drones":{"terminids":{"items":["ax-tx-13-dog-breath"],"share":0.75,"why":"Gas drone on bugs whenever the backpack is free."},"illuminate":{"items":["ax-las-5-rover","ax-ar-23-guard-dog"],"share":0.75,"why":"Laser or Liberator drone on squids."},"automatons":{"items":["ax-ar-23-guard-dog"],"share":0.75,"singleShot":true,"why":"Liberator drone on bots when the primary is single-shot, for close swarms."}},"singleShot":["r-36-eruptor","r-63cs-diligence-counter-sniper","r-63-diligence","r-72-censor","r-40-sightliner","r-6-deadeye","r-2124-constitution","r-40-k-hot-shot-marksman-rifle","r-4-hyena","r-2-amendment","cb-9-exploding-crossbow","plas-101-purifier","jar-5-dominator","gl-15-evictor"]};
const IT = DATA.items;
const FAC = Object.fromEntries(DATA.factions.map(f => [f.id, f]));
const MIS = Object.fromEntries(DATA.missions.map(m => [m.id, m]));
const LO = {};
for (const f of DATA.factions) for (const l of f.loadouts) LO[l.id] = Object.assign(l, {faction: f.id});
for (const m of DATA.missions) for (const l of m.loadouts) LO[l.id] = Object.assign(l, {mission: m.id});
const NEEDS = {};             // item id -> [{need, why}]
for (const s of DATA.synergies) if (s.needs) for (const id of s.items) (NEEDS[id] = NEEDS[id] || []).push(s);
// heavy-armor coverage: anti-tank for bots, bugs and the bot-only missions; AP4+ is enough for squids
const HV = DATA.heavy, AT = new Set(HV.at), HEAVY = new Set(HV.heavy);
// the user's defaults: Breacher / Ultimatum as the fallback sidearm, Pyrotech / Gas as throwables
const PREF = DATA.prefer, FALLBACK = new Set(PREF.secondary.items), PREF_SET = {secondary: FALLBACK, throwable: new Set(PREF.throwable.items)};
const needOf = l => HV.need[l.faction || 'missions'];
const answers = (id, need) => AT.has(id) || (need === 'heavy' && HEAVY.has(id));
// strike rule: one orbital + one eagle per roll (Commando exempt; bots on Megafactories trade the eagle for an orbital)
const STR = DATA.strikes, RARE = new Set(DATA.rare.items), DRONES = DATA.drones, SINGLE = new Set(DATA.singleShot);
const isOrb = id => IT[id].sub === 'Orbital', isEag = id => IT[id].sub === 'Eagle';
const NAV_TOP = false;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ARW = {U: '↑', D: '↓', L: '←', R: '→'};
const arrows = c => (c || '').split('').map(x => ARW[x] || '').join('');

/* ---------- small renderers ---------- */
function pic(it, cls) {
  const sq = it.kind === 'strat' ? ' sq' : '';
  return it.img ? `<span class="pic${sq} ${cls || ''}"><img src="${src(it)}" alt="" loading="lazy"></span>`
                : `<span class="pic none${sq}">${esc((it.short || '?').slice(0, 3).toUpperCase())}</span>`;
}
const apTag = it => it.pen ? `<span class="tag ap ap${it.penEff || it.pen}" title="${esc(it.penWhy || it.penText)}">AP${it.pen}${it.penEff ? '/' + it.penEff : ''}</span>` : '';
function meta(it) {
  const bits = [];
  if (it.kind === 'strat') {
    if (it.weapon && it.pen) bits.push(apTag(it));
    if (it.backpack) bits.push('<span class="tag pack">Backpack</span>');
    bits.push(`<span class="code">${arrows(it.code)}</span>`);
    if (it.cooldown) bits.push(`<span>${esc(it.cooldown)}</span>`);
  } else if (it.kind === 'armor') {
    bits.push(`<span>${esc(it.sub)} · ${esc(it.passive)}</span>`);
  } else {
    bits.push(apTag(it));
    if (it.sub) bits.push(`<span>${esc(it.sub.replace(/s$/, ''))}</span>`);
  }
  if (it.new) bits.push('<span class="tag new">New</span>');
  return bits.join('');
}
function judge(o, kind, sub) {
  // subfaction-aware marks: preferred picks first, under-penetrating primaries and avoided picks last
  if (!sub) return '';
  if ((sub.prefer || []).includes(o.id)) return 'pick';
  if ((sub.avoid || []).includes(o.id)) return 'weak';
  const it = IT[o.id];
  if (kind === 'primary' && sub.minPen && it.pen && penOf(it) < sub.minPen) return 'weak';
  return '';
}
const penOf = it => it.penEff || it.pen;
function row(o, kind, sub, l) {
  const it = IT[o.id];
  const j = judge(o, kind, sub);
  const jtag = j === 'pick' ? `<span class="tag pick">Pick vs ${esc(sub.short || sub.name)}</span>`
             : j === 'weak' ? `<span class="tag weak">${kind === 'primary' && penOf(it) < (sub.minPen || 0) ? 'Under AP' + sub.minPen : 'Weak here'}</span>` : '';
  const otag = (o.tag === 'new' ? '<span class="tag new">Suggested</span>' : o.tag === 'alt' ? '<span class="tag alt">Situational</span>' : '') +
    (AT.has(o.id) ? '<span class="tag at" title="Handles tanks, Factory Striders and Titans">AT</span>' : '') +
    (RARE.has(o.id) ? `<span class="tag alt" title="${esc(DATA.rare.why)}">${esc(DATA.rare.label)}</span>` : '');
  return `<li class="${j}"><button class="row-main" data-item="${o.id}">${pic(it)}<span class="row-text">
    <span class="row-name">${esc(it.short)}</span><span class="row-sub">${meta(it)}${otag}${jtag}</span>
    ${o.note ? `<span class="row-note">${esc(o.note)}</span>` : ''}</span></button>
    <button class="like" data-like="${o.id}" aria-pressed="${!!S.likes[o.id]}" aria-label="Like ${esc(it.short)}">${SVG.heart}</button></li>`;
}
function sortJudged(opts, kind, sub) {
  // the user's defaults (Breacher / Ultimatum, Pyrotech / Gas) stay on top; then variant picks, then the rest
  const w = o => (PREF_SET[kind] && PREF_SET[kind].has(o.id) ? -1 : ({pick: 0, '': 1, weak: 2})[judge(o, kind, sub)]);
  return opts.map((o, i) => [o, i]).sort((a, b) => w(a[0]) - w(b[0]) || a[1] - b[1]).map(x => x[0]);
}
function synNotes(opts, l) {
  // one line per synergy that touches these options: "needs" pairings, then armor-passive tips the loadout's armor
  // doesn't already cover
  const ids = new Set(opts.map(o => o.id)), out = [];
  const worn = new Set((l && l.armor && l.armor.passives) || []);
  for (const s of DATA.synergies) {
    if (s.passives && s.passives.some(x => worn.has(x))) continue;
    const hit = s.items.filter(i => ids.has(i));
    if (!hit.length) continue;
    const names = hit.map(i => esc(IT[i].short)).join(', ');
    if (s.needs) out.push(`<p class="syn">${SVG.pair}<span><b>${names}</b> → bring <b>${esc(IT[s.needs].short)}</b>. ${esc(s.why)}</span></p>`);
    else if (s.passives) out.push(`<p class="syn">${SVG.pair}<span><b>${names}</b> pair with <b>${esc(s.passives.join(' / '))}</b> armor. ${esc(s.why)}</span></p>`);
  }
  return out.join('');
}

/* ---------- router ---------- */
const view = $('#view');
const TABS = [['', 'Loadouts', SVG.tLoad], ['missions', 'Missions', SVG.tMis], ['roll', 'Random', SVG.dice], ['armory', 'Armory', SVG.tArm], ['intel', 'Intel', SVG.tIntel]];
/* in-view tabs, remembered per view type */
function vtabs(key, list, cur) {
  return `<div class="vtabs" role="tablist">${list.map(([id, lab, n]) =>
    `<button role="tab" class="vtab" data-vt="${key}:${id}" aria-selected="${id === cur}">${esc(lab)}${n != null ? ` <i>${n}</i>` : ''}</button>`).join('')}</div>`;
}
const vt = (key, ids) => { const t = (S.tabs || {})[key]; return ids.includes(t) ? t : ids[0]; };
function bindVtabs(rerender) {
  view.querySelectorAll('[data-vt]').forEach(b => b.onclick = () => {
    const [k, id] = b.dataset.vt.split(':'); S.tabs = S.tabs || {}; S.tabs[k] = id; save(); rerender(); });
}
function rollFor(ctx, pool) { S.roll.ctx = ctx; S.roll.pool = pool || 'fav'; S.roll.autoroll = true; save(); go('#roll'); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, b] = h.split('~');
  closeSheet(true);
  let tab = '';
  if (FAC[a]) { renderFaction(a); }
  else if (a === 'lo' && LO[b]) { renderLoadout(b); tab = LO[b].mission ? 'missions' : ''; }
  else if (a === 'missions') { renderMissions(); tab = 'missions'; }
  else if (a === 'mission' && MIS[b]) { renderMission(b); tab = 'missions'; }
  else if (a === 'roll') { renderRoll(); tab = 'roll'; }
  else if (a === 'armory') { renderArmory(); tab = 'armory'; }
  else if (a === 'intel') { renderIntel(); tab = 'intel'; }
  else { renderHome(); }
  $('#tabs').innerHTML = TABS.map(([id, label, ic]) =>
    `<a class="tab" href="#${id}" ${id === tab ? 'aria-current="page"' : ''}>${ic}<span>${label}</span></a>`).join('');
  window.scrollTo(0, 0);
}
function bar(title, back) {
  $('#title').innerHTML = title;
  const b = $('#back');
  b.hidden = !back;
  b.onclick = () => { location.hash = back || ''; };
  $('#barMeta').textContent = back ? '' : 'wiki ' + DATA.asOf;
}
const go = h => { if (location.hash === h) route(); else location.hash = h; };

/* ---------- home ---------- */
function renderHome() {
  bar('HD2 <b>Loadouts</b>');
  const tiles = DATA.factions.map(f => `<a class="ftile ${KCLASS[f.id]}" href="#${f.id}" style="text-decoration:none">
      <h2>${esc(f.name)}</h2><span class="nick">${f.loadouts.length} loadouts</span>
      <p>${esc(f.doctrine)}</p>
      <span class="subs">${f.subfactions.map(s => `<span class="tag">${esc(s.name)}</span>`).join('')}</span></a>`).join('');
  view.innerHTML = `<a class="cta" href="#roll">${SVG.dice}<span><b>Stratagem randomizer</b>
      <small>Roll a loadout from your ★ favourites, following your rules: orbital + eagle, anti-tank, drones.</small></span></a>
    <div class="eyebrow">Pick the front <span>${DATA.factions.reduce((n, f) => n + f.subfactions.length, 0)} variants</span></div>
    <div class="ftiles">${tiles}</div>
    <div class="eyebrow">Your doctrine</div>
    <div class="panel"><ul class="doctrine">${DATA.doctrine.map(d => `<li class="${d.k ? 'k-' + d.k : ''}"><b>${esc(d.label)}</b><span>${esc(d.text)}</span></li>`).join('')}</ul></div>
    <p class="foot">Item data from helldivers.wiki.gg (${esc(DATA.asOf)}). Tap ♥ on any pick to feed the randomizer.</p>`;
}

/* ---------- faction ---------- */
function subChips(fid, sub, attr) {
  return `<div class="chips" role="group" aria-label="Subfaction">${FAC[fid].subfactions.map(s =>
    `<button class="chip" ${attr}="${s.id}" aria-pressed="${s.id === sub.id}">${esc(s.name)}</button>`).join('')}</div>`;
}
function brief(sub) {
  const foes = (sub.enemies || []).map(e => `<li><span class="fn">${esc(e.name)}</span><span class="fa">${esc(e.armor || '')}</span>${e.note ? `<span class="fx">${esc(e.note)}</span>` : ''}</li>`).join('');
  return `<section class="brief">
    <h3>${esc(sub.name)}</h3><p class="tagline">${esc(sub.tagline)}</p>
    <dl class="need"><div><dt>Primary pen</dt><dd>${sub.minPen ? 'AP' + sub.minPen + '+' : '—'}</dd></div>
      <div><dt>Armor</dt><dd>${esc(sub.armor || '—')}</dd></div><div><dt>Anti-tank</dt><dd>${esc(sub.at || '—')}</dd></div></dl>
    ${foes ? `<ul class="foes">${foes}</ul>` : ''}
    ${(sub.tips || []).length ? `<ul class="tips">${sub.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    ${(sub.bring || []).length ? `<div class="slot-label" style="margin:2px 0 -4px">Bring</div><ul class="rows bring">${sub.bring.map(id => row({id}, IT[id].kind, null)).join('')}</ul>` : ''}
  </section>`;
}
function lcard(l, sub) {
  const firsts = l.slots.map(s => liked(s.options)[0] || s.options[0]);
  const strip = firsts.map(o => o && IT[o.id].img ? `<img src="${src(IT[o.id])}" alt="${esc(IT[o.id].short)}" loading="lazy">` : '<span class="ph"></span>').join('');
  const g = [['primary', l.primary], ['secondary', l.secondary], ['throwable', l.throwable]].filter(x => x[1].length)
    .map(([k, opts]) => { const o = sortJudged(liked(opts).concat(opts.filter(x => !S.likes[x.id])), k, sub)[0]; return `<b>${esc(IT[o.id].short)}</b>${opts.length > 1 ? ` +${opts.length - 1}` : ''}`; });
  const armor = l.armor ? `${esc((l.armor.weight || []).join('/'))}${l.armor.passives && l.armor.passives.length ? ' · ' + esc(l.armor.passives.join(' / ')) : ''}` : '';
  const subnote = sub && l.sub && l.sub[sub.id] ? `<span class="tag pick">${esc(sub.short || sub.name)} tweak</span>` : '';
  const newc = countNew(l);
  return `<div class="lcard ${kOf(l)}"><a class="lcard-body" href="#lo~${l.id}">
      <div class="lcard-top"><div><h3>${esc(l.name)}</h3><p class="role">${esc(l.role)}</p></div></div>
      <div class="strip">${strip}</div>
      <p class="gear">${g.join(' · ')}${armor ? ' · ' + armor : ''}</p>
      ${subnote || newc || l.faction === undefined ? `<div class="badges">${l.factions ? l.factions.map(f => `<span class="tag">${esc(FAC[f].nick)}</span>`).join('') : ''}${newc ? `<span class="tag new">${newc} suggested</span>` : ''}${subnote}</div>` : ''}
    </a>
    <button class="fav" data-fav="${l.id}" aria-pressed="${!!S.fav[l.id]}" aria-label="Favourite ${esc(l.name)}">${SVG.star}</button></div>`;
}
function allOpts(l) { return [].concat(l.primary, l.secondary, l.throwable, l.armor ? l.armor.sets : [], ...l.slots.map(s => s.options)); }
const countNew = l => allOpts(l).filter(o => o.tag === 'new').length;
const liked = opts => opts.filter(o => S.likes[o.id]);
function renderFaction(fid) {
  const f = FAC[fid], sub = subOf(fid);
  bar(esc(f.name), '#');
  view.className = 'wrap ' + KCLASS[fid];
  const tab = vt('fac', ['loadouts', 'brief']);
  view.innerHTML = `<section class="fhead"><h2>${esc(f.name)}</h2><p>${esc(f.doctrine)}</p>
      <button class="btn" id="rollF">${SVG.dice}Roll a ${esc(f.nick.replace(/s$/, ''))} loadout</button></section>
    <div class="eyebrow">Variant <span>affects pen marks + tweaks</span></div>
    ${subChips(fid, sub, 'data-sub')}
    ${vtabs('fac', [['loadouts', 'Loadouts', f.loadouts.length], ['brief', 'Variant brief']], tab)}
    ${tab === 'brief' ? brief(sub) : `<p class="count">★ = in the randomizer</p><div class="lcards">${f.loadouts.map(l => lcard(l, sub)).join('')}</div>`}`;
  view.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.sub[fid] = b.dataset.sub; save(); renderFaction(fid); });
  $('#rollF').onclick = () => rollFor(fid);
  bindVtabs(() => renderFaction(fid));
}

/* ---------- loadout detail ---------- */
function section(label, opts, kind, sub, hint, l) {
  if (!opts || !opts.length) return '';
  return `<div class="slot"><div class="slot-label">${esc(label)}${hint ? `<i>${esc(hint)}</i>` : ''}</div>
    <ul class="rows">${sortJudged(opts, kind, sub).map(o => row(o, kind, sub, l)).join('')}</ul>${synNotes(opts, l)}</div>`;
}
function coverage(l) {
  // where this loadout's answer to heavy armor comes from; "sure" when one pick is guaranteed whatever you choose
  const need = needOf(l), parts = [];
  l.slots.forEach((s, i) => { const a = s.options.filter(o => answers(o.id, need));
    if (a.length) parts.push({where: `Slot ${i + 1}`, ids: a.map(o => o.id), all: a.length === s.options.length}); });
  for (const [k, lab] of [['secondary', 'Secondary'], ['throwable', 'Throwable'], ['primary', 'Primary']]) {
    const a = l[k].filter(o => answers(o.id, need));
    if (a.length) parts.push({where: lab, ids: a.map(o => o.id), all: a.length === l[k].length});
  }
  return {need, parts, sure: parts.some(p => p.all && p.where.startsWith('Slot'))};
}
function coverageHTML(l) {
  const c = coverage(l);
  const li = c.parts.map(p => `<li><b>${esc(p.where)}</b>: ${p.ids.map(id => esc(IT[id].short)).join(', ')}${p.all ? ' <span class="tag pick">always</span>' : ''}</li>`).join('');
  const tail = c.sure ? 'Your stratagems always bring one, so the sidearm is free.'
    : `If your stratagems don't bring one, take ${PREF.secondary.items.map(id => esc(IT[id].short)).join(' or ')}. The randomizer does this for you.`;
  return `<div class="callout cover"><strong>Heavy armor · ${esc(HV.label[c.need])}</strong><span class="muted">${esc(HV.why[c.need])}</span>
    <ul>${li}</ul><span>${tail}</span></div>`;
}
function renderLoadout(id) {
  const l = LO[id];
  const sub = l.faction ? subOf(l.faction) : null;
  const ctx = l.faction ? FAC[l.faction].name : MIS[l.mission].name;
  bar(esc(l.name), l.faction ? '#' + l.faction : '#mission~' + l.mission);
  view.className = 'wrap ' + kOf(l);
  const subTweak = sub && l.sub && l.sub[sub.id];
  const facNotes = l.factionNotes ? Object.entries(l.factionNotes).map(([f, t]) => `<div class="callout ${KCLASS[f]}"><strong>vs ${esc(FAC[f].name)}</strong><span>${esc(t)}</span></div>`).join('') : '';
  const a = l.armor || {};
  const armorHint = [(a.weight || []).join(' / '), (a.passives || []).join(' / ')].filter(Boolean).join(' · ');
  const tab = vt('lo', ['strats', 'gear', 'tips']);
  const nTips = (subTweak ? 1 : 0) + Object.keys(l.factionNotes || {}).length + (l.notes || []).length + 1;
  const body = tab === 'gear' ? `
    ${section('Primary', l.primary, 'primary', sub, '', l)}
    ${section('Secondary', l.secondary, 'secondary', sub, 'Breacher / Ultimatum by default', l)}
    ${section('Throwable', l.throwable, 'throwable', sub, 'Pyrotech / Gas by default', l)}
    ${section('Armor', a.sets || [], 'armor', sub, armorHint, l)}`
    : tab === 'tips' ? `
    ${subTweak ? `<div class="callout" style="margin-top:12px"><strong>vs ${esc(sub.name)}</strong><ul>${subTweak.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    ${facNotes ? `<div style="display:grid;gap:8px;margin-top:12px">${facNotes}</div>` : ''}
    ${coverageHTML(l)}
    ${(l.notes || []).length ? `<div class="eyebrow">Notes</div><div class="panel prose"><ul>${l.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}`
    : l.slots.map((s, i) => section(`${i + 1} · ${s.label}`, s.options, 'strat', sub, s.hint, l)).join('');
  view.innerHTML = `<section class="lhead">
      <span class="ctx">${esc(ctx)}${sub ? ' · ' + esc(sub.name) : ''}</span>
      <h2>${esc(l.name)}</h2><p>${esc(l.role)}</p>
      <div class="actions"><button class="btn primary" id="rollThis">${SVG.dice}Roll this</button></div>
      <button class="fav" data-fav="${l.id}" aria-pressed="${!!S.fav[l.id]}" aria-label="Favourite">${SVG.star}</button>
    </section>
    ${sub ? `<div class="eyebrow">Variant</div>${subChips(l.faction, sub, 'data-lsub')}` : ''}
    ${vtabs('lo', [['strats', 'Stratagems'], ['gear', 'Gear'], ['tips', 'Tips', nTips]], tab)}
    ${body}`;
  $('#rollThis').onclick = () => rollFor(l.faction || 'missions', id);
  view.querySelectorAll('[data-lsub]').forEach(b => b.onclick = () => { S.sub[l.faction] = b.dataset.lsub; save(); renderLoadout(id); });
  bindVtabs(() => renderLoadout(id));
}

/* ---------- missions ---------- */
function renderMissions() {

/* ---------- randomizer ---------- */
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
function poolFor(opts, kind, sub, R) {
  let p = opts.slice();
  if (R.pen && sub && kind === 'primary') { const q = p.filter(o => judge(o, kind, sub) !== 'weak'); if (q.length) p = q; }
  if (R.liked) { const q = p.filter(o => S.likes[o.id]); if (q.length) p = q; }
  return p;
}
function rollSlots(l, sub, R, prev, locks) {
  const picks = [], used = new Set(), notes = [];
  // emplacements are niche: they are allowed in at most DATA.rare.share of rolls
  const allowRare = Math.random() < DATA.rare.share;
  const common = p => { if (allowRare) return p; const q = p.filter(o => !RARE.has(o.id)); return q.length ? q : p; };
  l.slots.forEach((s, i) => { if (locks[i] && prev && prev[i]) { picks[i] = prev[i]; used.add(prev[i]); } });
  l.slots.forEach((s, i) => {
    if (picks[i]) return;
    const p = common(poolFor(s.options, 'strat', sub, R).filter(o => !used.has(o.id)));
    const o = pickOne(p.length ? p : s.options);
    picks[i] = o.id; used.add(o.id);
  });
  const fixed = new Set();
  // required pairings: an ammo-hungry weapon pulls its partner (e.g. Supply Pack) into a slot that offers it
  for (let i = 0; i < picks.length; i++) for (const s of NEEDS[picks[i]] || []) {
    if (picks.includes(s.needs)) { fixed.add(picks.indexOf(s.needs)); continue; }
    const j = l.slots.findIndex((sl, k) => k !== i && !locks[k] && !fixed.has(k) && sl.options.some(o => o.id === s.needs));
    if (j >= 0) { picks[j] = s.needs; fixed.add(j); notes.push({t: `${IT[s.needs].short} added for the ${IT[picks[i]].short}: ${s.why}`}); }
    else notes.push({w: 1, t: `${IT[picks[i]].short} wants a ${IT[s.needs].short}, which this loadout doesn't offer.`});
  }
  // backpack limit (one, unless the loadout carries a spare on purpose): swap a backpack pick for a non-backpack
  // option, trying the later slots first and skipping locked slots and forced pairings
  const limit = l.packs || 1;
  const packs = () => picks.map((id, i) => IT[id].backpack ? i : -1).filter(i => i >= 0);
  let guard = 8;
  while (packs().length > limit && guard--) {
    let done = false;
    for (const j of packs().reverse()) {
      if (locks[j] || fixed.has(j)) continue;
      const free = o => !IT[o.id].backpack && !picks.includes(o.id);
      const alt = common(poolFor(l.slots[j].options, 'strat', sub, R).filter(free));
      const o = pickOne(alt.length ? alt : common(l.slots[j].options.filter(free)));
      if (o) { picks[j] = o.id; done = true; break; }
    }
    if (!done) break;
  }
  if (packs().length > limit) notes.push({w: 1, t: 'Two backpack items rolled: ' + packs().map(i => IT[picks[i]].short).join(' + ') + '. Swap one.'});
  else if (limit > 1 && packs().length > 1) notes.push({t: 'Two backpacks on purpose: wear one, leave the other at the pods as a cache.'});
  return {picks, fixed: [...fixed], notes};
}
function rollGear(l, sub, R, prev, locks, covered) {
  const g = {};
  for (const k of ['primary', 'secondary', 'throwable']) {
    if (locks[k] && prev && prev[k]) { g[k] = prev[k]; continue; }
    let p = poolFor(l[k], k, sub, R);
    if (PREF_SET[k]) {
      // preferred picks most of the time; the fallback sidearm always when the stratagems bring no anti-tank
      const pref = p.filter(o => PREF_SET[k].has(o.id)), other = p.filter(o => !PREF_SET[k].has(o.id));
      const always = k === 'secondary' && !covered;
      if (pref.length && (always || !other.length || Math.random() < PREF[k].share)) p = pref;
      else if (other.length) p = other;
    }
    if (p.length) g[k] = pickOne(p).id;
  }
  if (l.armor && l.armor.sets.length) g.armor = locks.armor && prev && prev.armor ? prev.armor : pickOne(poolFor(l.armor.sets, 'armor', sub, R)).id;
  return g;
}
function ensureHeavy(l, sub, R, s, g, locks) {
  // every roll keeps an answer to heavy armor: secondary first (the user's habit), then throwable, then a stratagem slot
  const need = needOf(l), what = need === 'at' ? 'anti-tank' : 'heavy-pen';
  const has = () => s.picks.some(id => answers(id, need)) || (g && ['primary', 'secondary', 'throwable'].some(k => g[k] && answers(g[k], need)));
  if (has()) return;
  if (g) for (const k of ['secondary', 'throwable']) {
    if (locks[k]) continue;
    const opts = l[k].filter(o => answers(o.id, need));
    if (!opts.length) continue;
    const p = poolFor(opts, k, sub, R);
    g[k] = pickOne(p.length ? p : opts).id;
    s.notes.push({t: `No ${what} in the stratagems: ${IT[g[k]].short} is your answer to heavy armor.`});
    return;
  }
  if (!g && l.secondary.some(o => FALLBACK.has(o.id))) {
    s.notes.push({t: `No ${what} in these stratagems: take ${PREF.secondary.items.map(id => IT[id].short).join(' or ')}.`});
    return;

  const limit = l.packs || 1, packs = s.picks.filter(id => IT[id].backpack).length;

    const ok = l.slots[j].options.filter(o => answers(o.id, need) && !s.picks.includes(o.id) &&
      (!IT[o.id].backpack || IT[s.picks[j]].backpack || packs < limit));
    if (!ok.length) continue;
    const o = pickOne(ok); s.picks[j] = o.id;
    s.notes.push({t: `${IT[o.id].short} added: nothing else rolled handles heavy armor.`});
    return;
  }

function ensureStrikes(l, sub, R, s, locks) {
  if (l.mission && STR.exempt.includes(l.mission)) return;
  const mf = R.mf && l.faction === 'automatons';
  const swap = (j, opts) => { const p = poolFor(opts, 'strat', sub, R); const o = pickOne(p.length ? p : opts); s.picks[j] = o.id; return o.id; };
  if (mf) s.picks.forEach((id, j) => {
    if (!isEag(id) || locks[j]) return;
    // Megafactory: AA everywhere, so the eagle slot rolls a non-eagle option or a favourite orbital
    let opts = l.slots[j].options.filter(o => !isEag(o.id) && !s.picks.includes(o.id));
    if (!opts.length) opts = STR.orbital.filter(x => !s.picks.includes(x)).map(x => ({id: x}));
    if (opts.length) { const n = swap(j, opts); s.notes.push({t: `Megafactory: AA everywhere, so ${IT[n].short} instead of ${IT[id].short}.`}); }
  });
  const fix = (test, label) => {
    if (s.picks.some(test)) return;
    for (let j = l.slots.length - 1; j >= 0; j--) {
      if (locks[j] || s.fixed.includes(j)) continue;
      const cur = s.picks[j];
      if ((isOrb(cur) && s.picks.filter(isOrb).length === 1) || (isEag(cur) && s.picks.filter(isEag).length === 1)) continue;
      const opts = l.slots[j].options.filter(o => test(o.id) && !s.picks.includes(o.id));
      if (opts.length) { swap(j, opts); return; }
    }
    s.notes.push({w: 1, t: `No ${label} in this roll: this loadout has no free slot that offers one.`});

function applyDrone(l, sub, R, s, g, locks) {
  // the user's drones: gas drone on bugs, laser / Liberator drone on squids, Liberator drone on bots with a single-shot primary
  const d = DRONES[l.faction];
  if (!d || s.picks.some(id => d.items.includes(id))) return;
  if (d.singleShot && !(g && g.primary && SINGLE.has(g.primary))) return;
  if (Math.random() >= d.share) return;
  for (let j = 0; j < l.slots.length; j++) {
    if (locks[j] || s.fixed.includes(j)) continue;
    const opts = l.slots[j].options.filter(o => d.items.includes(o.id));
    if (!opts.length) continue;
    if (R.liked && l.slots[j].options.some(o => S.likes[o.id]) && !opts.some(o => S.likes[o.id])) continue;
    const cur = s.picks[j];
    if (s.picks.filter((id, k) => k !== j && IT[id].backpack).length >= (l.packs || 1)) continue;
    if ((isOrb(cur) && s.picks.filter(isOrb).length === 1) || (isEag(cur) && s.picks.filter(isEag).length === 1)) continue;
    const p = poolFor(opts, 'strat', sub, R), o = pickOne(p.length ? p : opts);

  const tabs = vtabs('intel', [['gear', 'New gear', I.newgear.length], ['patches', 'Patches', I.patches.length], ['syn', 'Synergies', DATA.synergies.length], ['data', 'Your data']], tab);
  const foot = `<p class="foot">Data: helldivers.wiki.gg (CC BY-SA), pulled ${esc(DATA.asOf)}. Research notes: ${esc(I.sources || '')}</p>`;
  if (tab !== 'data') {
    view.innerHTML = tabs + (tab === 'gear' ? `<p class="count">Released ${esc(I.sheetDate)} → ${esc(DATA.asOf)}, judged against your doctrine</p>${cards}`
      : tab === 'patches' ? `<div class="panel prose" style="margin-top:12px"><ul>${I.patches.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`
      : `<div class="panel prose" style="margin-top:12px"><ul>${syn}</ul></div>`) + foot;
    bindVtabs(renderIntel);
    return;
  }
  view.innerHTML = `${tabs}
    <div class="panel data" style="margin-top:12px"><p class="msg">Likes, favourites and roll history live on this phone only. Copy a backup before deleting the home-screen icon.</p>
      <div class="row"><button class="btn" id="bk">Copy backup</button><button class="btn" id="rs">Restore</button></div>
      <textarea id="bkText" hidden readonly></textarea>
      <div id="rsBox" hidden><textarea id="rsText" placeholder="Paste a backup here"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="rsGo">Restore backup</button></div></div>
      <p class="msg" id="dataMsg"></p></div>${foot}`;
  bindVtabs(renderIntel);
  // each action bumps the sequence, so a late clipboard answer can't overwrite a newer message
  let seq = 0;
  const say = (m, n) => { if (n === seq) $('#dataMsg').textContent = m; };
  $('#bk').onclick = () => { const t = $('#bkText'), n = ++seq; t.hidden = false;
    t.value = JSON.stringify({app: 'hd2', v: 1, state: {likes: S.likes, fav: S.fav, sub: S.sub}}); t.select();
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => say('Backup copied.', n), () => say('Select the text above and copy it.', n));
    else say('Select the text above and copy it.', n); };
  $('#rs').onclick = () => { $('#rsBox').hidden = false; };
  $('#rsGo').onclick = () => { const n = ++seq; try { const b = JSON.parse($('#rsText').value); if (b.app !== 'hd2' || !b.state) throw 0;
      Object.assign(S, {likes: b.state.likes || {}, fav: b.state.fav || {}, sub: b.state.sub || {}}); save(); say('Restored.', n); }
    catch (e) { say('That text is not a valid backup. Paste the whole text from “Copy backup”.', n); } };
}

/* ---------- item sheet ---------- */
const sheetWrap = $('#sheetWrap'), sheet = $('#sheet');
function openItem(id) {
  const it = IT[id];
  const st = [];
  const add = (k, v, wide) => { if (v) st.push(`<div class="${wide ? 'wide' : ''}"><dt>${k}</dt><dd>${esc(v)}</dd></div>`); };
  if (it.kind === 'armor') { add('Armor', it.armor); add('Speed', it.speed); add('Stamina', it.stamina); add('Passive', it.passive);
    add('Passive effect', DATA.passives[it.passive], true); }
  else {
    if (it.code) add('Code', arrows(it.code)); if (it.cooldown) add('Cooldown', it.cooldown);
    if (it.penText) add('Penetration', (it.pen ? 'AP' + it.pen + ' · ' : '') + it.penText, it.penText.length > 22);
    add('Damage', it.damage, (it.damage || '').length > 22); add('Durable', it.durable); add('Fire rate', it.rate); add('Magazine', it.mag);
    add('Spare', it.spare); add('Radius', it.radius); add('Fuse', it.fuse); add('Modes', (it.modes || []).join(' · '));
    if (it.traits && it.traits.length) add('Traits', it.traits.join(' · '), true);
  }
  add('Source', it.source + (it.srcPage ? ' ' + it.srcPage : '') + (it.date ? ' · ' + it.date : ''), true);
  const uses = Object.values(LO).filter(l => allOpts(l).some(o => o.id === id));
  sheet.innerHTML = `<div class="sheet-inner"><div class="grab"></div><div class="sheet-top"><button class="close" id="close">Close</button></div>
    <div class="hero ${it.kind === 'strat' ? 'sq' : ''}">${it.img ? `<img src="${src(it)}" alt="">` : ''}</div>
    <h2 id="sheetTitle">${esc(it.short)}</h2><p class="full">${esc(it.name)} · ${esc(it.sub)}</p>
    <div class="facts">${meta(it)}</div>
    <dl class="stats">${st.join('')}</dl>
    ${uses.length ? `<h4>In your loadouts</h4><div class="inlo">${uses.map(l => `<button class="${kOf(l)}" data-lo="${l.id}">${esc(l.faction ? FAC[l.faction].nick : MIS[l.mission].name)} · ${esc(l.name)}</button>`).join('')}</div>` : ''}
    <div class="sheet-actions"><button class="btn ${S.likes[id] ? 'primary' : ''}" data-like="${id}" aria-pressed="${!!S.likes[id]}">${SVG.heart}${S.likes[id] ? 'Liked' : 'Like'}</button>
      <a class="btn" href="https://helldivers.wiki.gg/wiki/${encodeURIComponent(it.page.replace(/ /g, '_'))}" target="_blank" rel="noopener">${SVG.link}Wiki</a></div></div>`;
  sheetWrap.hidden = false;
  $('#close').onclick = () => closeSheet();
}
function closeSheet(silent) { sheetWrap.hidden = true; }
$('#scrim').onclick = () => closeSheet();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- global taps ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-like],[data-fav],[data-item],[data-lo]');
  if (!t) return;
  if (t.dataset.like) { const id = t.dataset.like; S.likes[id] = !S.likes[id]; if (!S.likes[id]) delete S.likes[id]; save();
    document.querySelectorAll(`[data-like="${id}"]`).forEach(b => b.setAttribute('aria-pressed', !!S.likes[id]));
    if (!sheetWrap.hidden && t.closest('#sheet')) openItem(id); return; }
  if (t.dataset.fav) { const id = t.dataset.fav; S.fav[id] = !S.fav[id]; if (!S.fav[id]) delete S.fav[id]; save(); t.setAttribute('aria-pressed', !!S.fav[id]); return; }
  if (t.dataset.item) { openItem(t.dataset.item); return; }
  if (t.dataset.lo) { go('#lo~' + t.dataset.lo); }
});
window.addEventListener('hashchange', route);
if (NAV_TOP) { document.body.classList.add('nav-top'); $('#bar').appendChild(document.querySelector('.tabs')); }
route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
